[package]
name = "zenith-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# rlib alongside cdylib so other contracts (options_market) can depend on
# this crate as a normal Rust library to get VaultClient's generated type
# for cross-contract tests, while still building a deployable wasm cdylib
# on its own — same pattern as price_oracle's Cargo.toml.
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
# Dev/test-only: registers a REAL multisig contract instance inside the
# test Env for cross-contract tests. Never linked into the production
# wasm (see src/multisig_client.rs).
multisig = { package = "zenith-multisig", path = "../multisig", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
