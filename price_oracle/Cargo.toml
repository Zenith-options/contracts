[package]
name = "zenith-price-oracle"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# rlib alongside cdylib so other contracts (options_market) can depend on
# this crate as a normal Rust library to get PriceOracleClient's generated
# type for cross-contract calls, while still building a deployable wasm
# cdylib on its own — the standard Soroban pattern for cross-contract
# dependencies.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
zenith-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Dev/test-only: registers a REAL multisig contract instance inside the
# test Env for cross-contract tests. Never linked into the production
# wasm (see src/multisig_client.rs).
multisig = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
