name: CI

on:
  push:
    branches: [main]
  pull_request:

# options_market cross-contract-calls price_oracle, multisig, vault, AND
# params (its parameter registry) via
# soroban-sdk's contractimport! against their compiled wasm (not a normal
# source dependency, to avoid linking their own contract functions into
# options_market's wasm and colliding on shared names like
# pause/transfer_admin). That means all four wasm files have to exist
# before options_market can even be *compiled*, native target included —
# every job below installs wasm32-unknown-unknown and builds price_oracle's,
# multisig's, vault's, and params' wasm first when it's about to touch
# options_market.
#
# price_oracle and vault each also now cross-call multisig the same way
# (for pause_via_multisig/unpause_via_multisig/transfer_admin_via_multisig),
# so both need multisig's wasm built first too — that's also why the
# multisig build step above runs before the vault build step, not just
# before options_market's.
#
        crate: [options_market, price_oracle, vault, multisig, streams, staking, timelock, governor, lp_token, lp_pool, integration_tests]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [options_market, price_oracle, vault, multisig, streams, staking, timelock, governor, lp_token, lp_pool, integration_tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - if: matrix.crate == 'options_market' || matrix.crate == 'price_oracle' || matrix.crate == 'vault' || matrix.crate == 'integration_tests'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: multisig
      - if: matrix.crate == 'options_market' || matrix.crate == 'integration_tests'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: price_oracle
      - if: matrix.crate == 'options_market' || matrix.crate == 'integration_tests'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: vault
      - if: matrix.crate == 'options_market'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: params
      - run: cargo build --all-targets
        working-directory: ${{ matrix.crate }}
      - run: cargo test
        working-directory: ${{ matrix.crate }}
      # Ledger invariant post-conditions compiled in, plus the slow
      # 10,000-op fuzz test that's #[ignore]d in the default run.
      - if: matrix.crate == 'vault'
        run: cargo test --features invariants -- --include-ignored
        working-directory: vault

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [options_market, price_oracle, vault, multisig, common, streams, staking, timelock, governor, params, grants_escrow, lp_token, lp_pool, integration_tests, tools/spec-diff]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - if: matrix.crate == 'options_market' || matrix.crate == 'price_oracle' || matrix.crate == 'vault' || matrix.crate == 'integration_tests'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: multisig
      - if: matrix.crate == 'options_market' || matrix.crate == 'integration_tests'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: price_oracle
      - if: matrix.crate == 'options_market' || matrix.crate == 'integration_tests'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: vault
      - if: matrix.crate == 'options_market'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: params
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: ${{ matrix.crate }}

  fmt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [options_market, price_oracle, vault, multisig, common, streams, staking, timelock, governor, params, grants_escrow, lp_token, lp_pool, integration_tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
        working-directory: ${{ matrix.crate }}

  wasm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [options_market, price_oracle, vault, multisig, streams, staking, timelock, governor, params, grants_escrow, lp_token, lp_pool, integration_tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - if: matrix.crate == 'options_market' || matrix.crate == 'price_oracle' || matrix.crate == 'vault' || matrix.crate == 'integration_tests'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: multisig
      - if: matrix.crate == 'options_market' || matrix.crate == 'integration_tests'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: price_oracle
      - if: matrix.crate == 'options_market' || matrix.crate == 'integration_tests'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: vault
      - if: matrix.crate == 'options_market'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: params
      - run: cargo build --target wasm32-unknown-unknown --release
        working-directory: ${{ matrix.crate }}

  # Public-ABI guard: every existing function, type and error in each
  # contract's spec must survive unchanged (additions are fine) unless
  # the PR lists it in tools/spec-diff/allow.txt. Also prints the wasm
  # size delta against the base branch.
  spec-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: tools/spec-diff/check.sh origin/${{ github.base_ref }}
