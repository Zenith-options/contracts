name: CI

on:
  push:
    branches: [main]
  pull_request:

# options_market cross-contract-calls price_oracle and vault via
# soroban-sdk's contractimport! against their compiled wasm (not a normal
# source dependency, to avoid linking their own contract functions into
# options_market's wasm and colliding on shared names like
# pause/transfer_admin). That means both wasm files have to exist before
# options_market can even be *compiled*, native target included — every
# job below builds price_oracle's and vault's wasm first when it's about
# to touch options_market.
#
# Multisig is no longer contractimport!-ed by anyone: the shared
# `common` crate (zenith-common) cross-calls it with invoke_contract, so
# no build-order dependency on multisig's wasm remains.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [options_market, price_oracle, vault, multisig, common]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - if: matrix.crate == 'options_market'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: price_oracle
      - if: matrix.crate == 'options_market'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: vault
      - run: cargo build --all-targets
        working-directory: ${{ matrix.crate }}
      - run: cargo test
        working-directory: ${{ matrix.crate }}

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [options_market, price_oracle, vault, multisig, common, tools/spec-diff]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - if: matrix.crate == 'options_market'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: price_oracle
      - if: matrix.crate == 'options_market'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: vault
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: ${{ matrix.crate }}

  fmt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [options_market, price_oracle, vault, multisig, common, tools/spec-diff]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
        working-directory: ${{ matrix.crate }}

  wasm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [options_market, price_oracle, vault, multisig]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - if: matrix.crate == 'options_market'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: price_oracle
      - if: matrix.crate == 'options_market'
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: vault
      - run: cargo build --target wasm32-unknown-unknown --release
        working-directory: ${{ matrix.crate }}

  # Public-ABI guard: every existing function, type and error in each
  # contract's spec must survive unchanged (additions are fine) unless
  # the PR lists it in tools/spec-diff/allow.txt. Also prints the wasm
  # size delta against the base branch.
  spec-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: tools/spec-diff/check.sh origin/${{ github.base_ref }}
