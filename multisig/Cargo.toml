[package]
name = "zenith-multisig"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# rlib alongside cdylib so other contracts (options_market) can depend on
# this crate as a normal Rust library for testutils setup, while still
# building a deployable wasm cdylib on its own — same as price_oracle.
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
