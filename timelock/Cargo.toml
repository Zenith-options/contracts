[package]
name = "zenith-timelock"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
# Dev/test-only: a REAL options_market instance for the integration test
# where the timelock is its admin. Never linked into the timelock wasm.
options_market = { package = "zenith-options-market", path = "../options_market", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
