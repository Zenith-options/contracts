[package]
name = "zenith-integration-tests"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Test-only crate: deploys every Zenith contract into one Env and walks the
# governance handover (docs/governance-handover.md) stage by stage. Its
# options_market dev-dependency needs other contracts' wasm to compile;
# `cargo xtask test` builds those first (from options_market's
# `[package.metadata.zenith] wasm-deps`).

[dependencies]

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
multisig = { workspace = true, features = ["testutils"] }
price_oracle = { workspace = true, features = ["testutils"] }
vault = { workspace = true, features = ["testutils"] }
options_market = { workspace = true, features = ["testutils"] }
timelock = { workspace = true, features = ["testutils"] }
governor = { workspace = true, features = ["testutils"] }
