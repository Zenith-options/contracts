[package]
name = "zenith-options-market"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# rlib alongside cdylib so timelock can depend on this crate for its
# cross-contract integration test, and so integration_tests/ can register a
# real options_market natively for the governance handover tests — same
# pattern as vault's Cargo.toml.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
zenith-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = { workspace = true }
# Dev/test-only: registers a REAL price_oracle contract instance inside the
# test Env for cross-contract tests. Never linked into the production wasm
# (see src/price_oracle_client.rs for how production code calls the other
# contract instead — via contractimport! against its compiled wasm, not by
# depending on and linking its actual implementation).
price_oracle = { workspace = true, features = ["testutils"] }
# Same reasoning as price_oracle above, for src/multisig_client.rs.
multisig = { workspace = true, features = ["testutils"] }
# Same reasoning as price_oracle above, for src/vault_client.rs.
vault = { workspace = true, features = ["testutils"] }
# Same reasoning as price_oracle above, for src/params_client.rs.
params = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

# Contracts whose compiled wasm this crate `contractimport!`s (the
# src/*_client.rs files). `cargo xtask build` reads this to build them first,
# in dependency order, into the shared workspace target/ directory;
# `cargo xtask check-imports` fails if a contractimport! path isn't listed.
[package.metadata.zenith]
wasm-deps = ["zenith-price-oracle", "zenith-vault", "zenith-params"]
